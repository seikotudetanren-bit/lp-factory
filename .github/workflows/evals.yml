name: evals

# 回帰テストと法令の一方通行ガード。改善提案のPRは両方が通っていることをマージの前提にする
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 回帰テスト
        run: python3 scripts/run_evals.py
      - name: 法令の一方通行ガード（PRのみ）
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_legal_oneway.py --base "origin/${{ github.base_ref }}"
